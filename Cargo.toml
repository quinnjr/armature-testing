[package]
name = "armature-testing"
version = "0.3.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-testing"
homepage = "https://quinnjr.github.io/armature"
description = "Testing utilities for Armature applications"
keywords = ["testing", "test", "mock", "fixtures"]
categories = ["development-tools::testing"]

[dependencies]
armature-core = { version = "0" }
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "test-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "2.0"
uuid = { version = "1.23", features = ["v4"] }

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"

